name: Django security and regression checks

on:
  push:
    branches: [main, codex/**]
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: ci-only-secret-not-for-production
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Django configuration
        run: python manage.py check
      - name: Ensure migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django regression tests
        run: python manage.py test apps.core.test_tenant_security apps.core.test_pwa apps.users.test_password_reset_security --verbosity 2
