name: Android mobile checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run mobile security tests
        run: npm test
      - name: Check types and Expo dependencies
        run: npm run typecheck && npx expo install --check
      - name: Compile Android JavaScript bundle
        run: npx expo export --platform android --output-dir .expo-export-check
