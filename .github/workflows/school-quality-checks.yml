name: School quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  finance-and-ui-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.audit_settings
      NEXUS_AUDIT_DB: /tmp/nexus-ci-school.sqlite3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check --settings=config.audit_settings
      - name: Finance safety and student UI checks
        run: python manage.py test apps.finance.test_payment_safety --settings=config.audit_settings --verbosity=2
