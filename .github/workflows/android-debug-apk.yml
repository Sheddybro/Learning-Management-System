name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # GitHub's Ubuntu runner already provides ANDROID_HOME and the Android
      # SDK. setup-android@v3 attempted to install the removed 'tools' package.
      - name: Confirm Android SDK available
        run: test -d "$ANDROID_HOME" && echo "Android SDK is available"
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Run security tests and type checks
        run: npm test && npm run typecheck && npx expo install --check
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build Android debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Archive Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-school-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
